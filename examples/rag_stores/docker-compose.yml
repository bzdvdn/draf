# One-shot start of the vector stores that need a server.
#
# Usage:
#   docker compose up -d
#   # ... run the qdrant / pgvector examples ...
#   docker compose down        # stop, keep volumes
#   docker compose down -v     # stop and wipe data
#
# in_memory and sqlite need no server; chroma persists to a local dir.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: draf-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: draf-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  qdrant_data:
  pgvector_data:
