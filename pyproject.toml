[project]
name = "draf"
version = "0.1.0-alpha"
description = "Workflow as data. Agents as graphs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embedding = [
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]
tools = [
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "boto3>=1.34",
    "slack-sdk>=3.27",
]
all = [
    "draf[embedding,tools]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["draf/"]
