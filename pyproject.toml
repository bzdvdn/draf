[project]
name = "draf"
version = "0.1.0-alpha"
description = "Workflow as data. Agents as graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agents", "workflow", "llm", "graph", "orchestration", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.18",
    "mcp[mcp]>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
embedding = [
    "qdrant-client>=1.9",
    "chromadb>=0.5",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "pgvector>=0.2",
    "faiss-cpu>=1.7",
    "lancedb>=0.26",
    "pymilvus>=2.4",
    "weaviate-client>=4.4",
    "pinecone>=5.0",
]
rag-pdf = [
    "pypdf>=4.0",
]
rag-excel = [
    "openpyxl>=3.1",
]
pg-checkpoint = [
    "asyncpg>=0.29",
]
tools = [
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "boto3>=1.34",
    "slack-sdk>=3.27",
    "psycopg>=3.1",
]
mcp = [
    "mcp>=1.0",
]
fastapi = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]
queue = [
    "celery[redis]>=5.4",
]
all = [
    "draf[embedding,tools,mcp,rag-pdf,rag-excel,pg-checkpoint,fastapi,queue]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["draf/scaffold/_common", "draf/scaffold/fastapi", "draf/scaffold/cli", "draf/scaffold/daemon", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["examples/"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
draf = "draf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["draf/"]
